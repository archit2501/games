<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Color Clash</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 9/16;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 46, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            border-radius: 10px;
        }
        #gameOverScreen {
            display: none;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .instructions {
            text-align: center;
            margin: 20px;
            line-height: 1.6;
            color: #aaa;
        }
        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        .score-display {
            font-size: 24px;
            margin: 10px 0;
        }
        .high-score {
            color: #ffd700;
        }
        #lives {
            display: flex;
            gap: 5px;
        }
        .heart {
            color: #ff6b6b;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div id="score">Score: 0</div>
            <div id="lives"></div>
        </div>
        <div id="startScreen">
            <h1>Color Clash</h1>
            <div class="instructions">
                Catch orbs matching your paddle color!<br><br>
                👈 Tap LEFT to move left<br>
                👉 Tap RIGHT to move right<br>
                👆 Tap CENTER to change color
            </div>
            <button id="startBtn">Play</button>
            <div class="score-display high-score" id="highScoreDisplay"></div>
        </div>
        <div id="gameOverScreen">
            <h1>Game Over</h1>
            <div class="score-display">Score: <span id="finalScore">0</span></div>
            <div class="score-display high-score">Best: <span id="finalHighScore">0</span></div>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('gameContainer');

        // Set canvas size
        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game state
        const colors = ['#ff6b6b', '#4ecdc4', '#ffd93d'];
        const colorNames = ['Red', 'Teal', 'Yellow'];
        let paddle = { x: 0, width: 80, height: 20, colorIndex: 0, speed: 8 };
        let orbs = [];
        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let highScore = parseInt(localStorage.getItem('colorClashHighScore')) || 0;
        let difficulty = 1;
        let lastSpawn = 0;
        let canvasWidth, canvasHeight;

        // UI Elements
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('lives');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const finalScore = document.getElementById('finalScore');
        const finalHighScore = document.getElementById('finalHighScore');

        // Update high score display
        if (highScore > 0) {
            highScoreDisplay.textContent = `Best: ${highScore}`;
        }

        function getCanvasSize() {
            const rect = container.getBoundingClientRect();
            canvasWidth = rect.width;
            canvasHeight = rect.height;
        }
        getCanvasSize();
        window.addEventListener('resize', getCanvasSize);

        function initGame() {
            getCanvasSize();
            paddle.x = canvasWidth / 2 - paddle.width / 2;
            paddle.colorIndex = 0;
            orbs = [];
            score = 0;
            lives = 3;
            difficulty = 1;
            lastSpawn = 0;
            updateUI();
        }

        function updateUI() {
            scoreDisplay.textContent = `Score: ${score}`;
            livesDisplay.innerHTML = '❤️'.repeat(lives);
        }

        function spawnOrb() {
            const size = 25 + Math.random() * 15;
            orbs.push({
                x: size + Math.random() * (canvasWidth - size * 2),
                y: -size,
                size: size,
                colorIndex: Math.floor(Math.random() * colors.length),
                speed: 2 + difficulty * 0.5 + Math.random() * 2
            });
        }

        function drawPaddle() {
            ctx.fillStyle = colors[paddle.colorIndex];
            ctx.shadowColor = colors[paddle.colorIndex];
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.roundRect(paddle.x, canvasHeight - 60, paddle.width, paddle.height, 10);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Color indicator
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(colorNames[paddle.colorIndex], paddle.x + paddle.width/2, canvasHeight - 35);
        }

        function drawOrbs() {
            orbs.forEach(orb => {
                ctx.fillStyle = colors[orb.colorIndex];
                ctx.shadowColor = colors[orb.colorIndex];
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(orb.x, orb.y, orb.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function updateOrbs() {
            for (let i = orbs.length - 1; i >= 0; i--) {
                const orb = orbs[i];
                orb.y += orb.speed;

                // Check collision with paddle
                if (orb.y + orb.size > canvasHeight - 60 &&
                    orb.y - orb.size < canvasHeight - 40 &&
                    orb.x > paddle.x - orb.size &&
                    orb.x < paddle.x + paddle.width + orb.size) {

                    if (orb.colorIndex === paddle.colorIndex) {
                        score += 10;
                        createParticles(orb.x, orb.y, colors[orb.colorIndex]);
                    } else {
                        lives--;
                        createParticles(orb.x, orb.y, '#ff0000');
                    }
                    orbs.splice(i, 1);
                    updateUI();
                    continue;
                }

                // Remove off-screen orbs
                if (orb.y > canvasHeight + orb.size) {
                    orbs.splice(i, 1);
                }
            }
        }

        // Particle system
        let particles = [];
        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1,
                    color
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvasHeight);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // Grid lines
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvasWidth; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvasHeight);
                ctx.stroke();
            }
            for (let i = 0; i < canvasHeight; i += 40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvasWidth, i);
                ctx.stroke();
            }
        }

        function gameLoop(timestamp) {
            if (!gameRunning) return;

            // Spawn orbs
            if (timestamp - lastSpawn > Math.max(500, 1500 - difficulty * 100)) {
                spawnOrb();
                lastSpawn = timestamp;
            }

            // Increase difficulty
            difficulty = 1 + score / 100;

            drawBackground();
            updateOrbs();
            updateParticles();
            drawOrbs();
            drawParticles();
            drawPaddle();

            if (lives <= 0) {
                gameOver();
                return;
            }

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameRunning = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('colorClashHighScore', highScore);
            }
            finalScore.textContent = score;
            finalHighScore.textContent = highScore;
            gameOverScreen.style.display = 'flex';
        }

        function startGame() {
            initGame();
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        // Touch/Click controls
        container.addEventListener('click', handleInput);
        container.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput(e.touches[0]);
        });

        function handleInput(e) {
            if (!gameRunning) return;

            const rect = container.getBoundingClientRect();
            const x = (e.clientX || e.pageX) - rect.left;
            const third = rect.width / 3;

            if (x < third) {
                // Move left
                paddle.x = Math.max(0, paddle.x - 50);
            } else if (x > third * 2) {
                // Move right
                paddle.x = Math.min(canvasWidth - paddle.width, paddle.x + 50);
            } else {
                // Change color
                paddle.colorIndex = (paddle.colorIndex + 1) % colors.length;
            }
        }

        // Button handlers
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        // Initial draw
        drawBackground();
    </script>
</body>
</html>
